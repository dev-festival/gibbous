<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title description">
  <title id="title">Gibbous — Telemetry</title>
  <desc id="description">Astronomical reports. An illustrative waxing gibbous Moon with 78 percent illumination and a 56 degree phase angle. Three annotations highlight in a slow loop.</desc>
  <defs>
    <linearGradient id="lunar-light" x2="1" y2=".2">
      <stop stop-color="#e6a453"/>
      <stop offset="1" stop-color="#ffdc8d"/>
    </linearGradient>
    <!-- A fixed noise field behind the artwork keeps fine type and lines legible. -->
    <filter id="background-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".59 .76" numOctaves="3" seed="12" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5h4" stroke="#f8d09a" stroke-opacity=".17"/>
    </pattern>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 0h24M0 0v24" stroke="#796647" stroke-opacity=".23"/>
      <path d="M12 12h1" stroke="#796647" stroke-opacity=".24"/>
    </pattern>
    <!-- The terminator has a horizontal radius of 62 × cos(56°). -->
    <path id="lit-disc" d="M0 -62 A62 62 0 0 1 0 62 A34.67 62 0 0 1 0 -62Z"/>
    <clipPath id="illuminated-clip"><use href="#lit-disc"/></clipPath>
    <style>
      .caption { font: 11px Consolas, "Courier New", monospace; letter-spacing: 1.65px; fill: #c0aa83; }
      .measurement { font: bold 14px Consolas, "Courier New", monospace; fill: #ffe0a3; }
      .leader { fill: none; stroke: #796647; stroke-width: 1; }
      .trace { fill: none; stroke: #ffc270; stroke-width: 1.6; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; animation: draw 30s linear infinite; }
      .marker { fill: #ffc270; opacity: .24; animation: mark 30s linear infinite; }
      .second { animation-delay: -20s; }
      .third { animation-delay: -10s; }
      @keyframes draw {
        0% { stroke-dashoffset: 100; opacity: 0; }
        3% { opacity: 1; }
        15%, 27% { stroke-dashoffset: 0; opacity: 1; }
        33%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes mark {
        0%, 6%, 33%, 100% { opacity: .24; }
        15%, 27% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .trace, .marker { animation: none; }
      }
    </style>
  </defs>

